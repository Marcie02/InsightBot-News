<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InsightBot Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    /* Fixed navbar height */
    .navbar {
      height: 56px;
    }

    /* Title section */
    .page-title {
      margin-top: 70px;   /* push below navbar */
      margin-bottom: 20px; /* breathing space before dashboard */
    }

    /* Fullscreen Tableau container */
    .dashboard-container {
      position: absolute;
      top: 120px;  /* navbar (56px) + title (≈64px) */
      left: 0;
      right: 0;
      bottom: 0;
    }

    .tableauPlaceholder, .tableauViz {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand fs-3 fw-bold" href="/">InsightBot News</a>
      <div>
        {% if current_user.is_authenticated %}
          <span class="text-white me-3">Hi, {{ current_user.username }}</span>
          {% if current_user.is_admin %}
            <a class="btn btn-sm btn-warning me-2" href="{{ url_for('admin_approve') }}">Admin Panel</a>
          {% endif %}
          <a class="btn btn-sm btn-outline-light" href="{{ url_for('logout') }}">Logout</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Page Title -->
  <div class="container-fluid text-center page-title">
    <h2 class="fw-bold">News Insights Dashboard</h2>
  </div>

  <!-- Fullscreen Tableau Dashboard -->
  <div class="dashboard-container">
    <div class='tableauPlaceholder' id='viz1757907515850'>
      <noscript>
        <a href='#'>
          <img alt='News Insight Dashboard'
            src='https://public.tableau.com/static/images/In/InsightBotDashboard/NewsInsightDashboard/1_rss.png'
            style='border: none' />
        </a>
      </noscript>
      <object class='tableauViz' style='display:none;'>
        <param name='host_url' value='https%3A%2F%2Fpublic.tableau.com%2F' />
        <param name='embed_code_version' value='3' />
        <param name='site_root' value='' />
        <param name='name' value='InsightBotDashboard/NewsInsightDashboard' />
        <param name='tabs' value='no' />
        <param name='toolbar' value='yes' />
        <param name='static_image' value='https://public.tableau.com/static/images/In/InsightBotDashboard/NewsInsightDashboard/1.png' />
        <param name='animate_transition' value='yes' />
        <param name='display_static_image' value='yes' />
        <param name='display_spinner' value='yes' />
        <param name='display_overlay' value='yes' />
        <param name='display_count' value='yes' />
        <param name='language' value='en-US' />
        <param name='filter' value='publish=yes' />
      </object>
    </div>
  </div>

  <script type='text/javascript'>
    var divElement = document.getElementById('viz1757907515850');
    var vizElement = divElement.getElementsByTagName('object')[0];
    vizElement.style.width = '100%';
    vizElement.style.height = '100%';
    var scriptElement = document.createElement('script');
    scriptElement.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
    vizElement.parentNode.insertBefore(scriptElement, vizElement);
  </script>

</body>
</html>
